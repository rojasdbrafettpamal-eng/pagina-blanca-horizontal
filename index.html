<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página en blanco con diseño horizontal.">
  <meta name="theme-color" content="#ffffff">
  <title>Página blanca horizontal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 0; }
    main { width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; background: #fff; }
    @media (orientation: portrait) { main { width: 100vw; aspect-ratio: 16 / 9; } }
  </style>
</head>
<body>
  <main aria-label="Lienzo blanco horizontal"></main>
</body>
</html>
